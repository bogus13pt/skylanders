<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skylanders — Portal Master Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;500;600;700;800;900&family=Exo+2:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060812;--surface:#0c0f1e;--surface2:#111528;--surface3:#161b32;
  --border:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.14);
  --gold:#ffd700;--gold-dim:rgba(255,215,0,0.12);
  --sky:#00c8ff;--sky-dim:rgba(0,200,255,0.12);
  --text:#dde4f0;--muted:#4a5370;--muted2:#7a85a0;
  --radius:14px;--card-w:158px;
  /* elements */
  --fire:#ff4400;--water:#0099ff;--earth:#cc7700;--air:#88ddff;
  --life:#33cc44;--undead:#9933cc;--magic:#ff33bb;--tech:#ffaa00;
  --light:#ffee33;--dark:#552299;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}

/* ── noise overlay ── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.6}

/* ── header ── */
header{position:relative;overflow:hidden;padding:72px 24px 52px;text-align:center;background:linear-gradient(180deg,#0a0c1f 0%,var(--bg) 100%);border-bottom:1px solid var(--border)}
header::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 100% 70% at 50% -10%,rgba(0,200,255,.15) 0%,rgba(255,215,0,.08) 40%,transparent 70%);pointer-events:none}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,200,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.03) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 80% 80% at 50% 0%,black,transparent)}

/* portal glow rings */
.portal-rings{position:absolute;left:50%;top:0;transform:translate(-50%,-60%) rotate(0deg);width:600px;height:600px;pointer-events:none;opacity:.07}
.portal-rings div{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sky);animation:spin 20s linear infinite}
.portal-rings div:nth-child(2){inset:40px;border-color:var(--gold);animation-duration:15s;animation-direction:reverse}
.portal-rings div:nth-child(3){inset:80px;border-color:#ff33bb;animation-duration:25s}
@keyframes spin{to{transform:rotate(360deg)}}

.eyebrow{font-family:'Exo 2',sans-serif;font-size:11px;font-weight:800;letter-spacing:8px;text-transform:uppercase;color:var(--sky);margin-bottom:14px;position:relative;z-index:1}
h1{font-family:'Russo One',sans-serif;font-size:clamp(3.5rem,11vw,7rem);letter-spacing:4px;line-height:.92;position:relative;z-index:1;background:linear-gradient(135deg,#00c8ff 0%,#ffd700 40%,#ff33bb 70%,#00c8ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% auto;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:200% center}}
.subtitle{font-size:13px;color:var(--muted2);margin-top:12px;position:relative;z-index:1;letter-spacing:.5px}
.subtitle strong{color:var(--gold);font-weight:700}

.stats{display:flex;justify-content:center;gap:0;margin:24px auto 0;max-width:520px;position:relative;z-index:1;border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);background:rgba(10,12,28,.7)}
.stat{flex:1;padding:13px 12px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-val{font-family:'Russo One',sans-serif;font-size:1.55rem;color:var(--text);line-height:1}
.stat-val.gold{color:var(--gold)}
.stat-val.sky{color:var(--sky)}
.stat-lbl{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* ── controls ── */
.controls{max-width:1300px;margin:28px auto 0;padding:0 20px}
.search-wrap{position:relative;margin-bottom:14px}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:15px}
input[type="text"]{width:100%;background:var(--surface);border:1px solid var(--border-bright);border-radius:10px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:15px;padding:12px 18px 12px 44px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type="text"]:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-dim)}
input[type="text"]::placeholder{color:var(--muted)}

.filter-group{margin-bottom:10px}
.filter-label{display:inline-block;font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;margin-right:4px}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.filter-btn{background:transparent;border:1px solid var(--border-bright);border-radius:999px;color:var(--muted2);cursor:pointer;font-family:'Exo 2',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 13px;transition:all .15s;white-space:nowrap}
.filter-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.filter-btn.active{color:#000;border-color:transparent}

.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.owned-pill{background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.3);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--sky);font-family:'Exo 2',sans-serif;letter-spacing:.5px}
.count-pill{font-size:12px;color:var(--muted);font-family:'Exo 2',sans-serif}
.view-toggle{display:flex;gap:4px}
.view-btn{background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--muted);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.view-btn.active{background:var(--sky);border-color:var(--sky);color:#000}

/* ── section labels ── */
.section-label{max-width:1300px;margin:28px auto 12px;padding:0 20px;display:flex;align-items:center;gap:14px}
.section-label span{font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── grid & card ── */
.grid{max-width:1300px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:11px}
.grid.list-view{grid-template-columns:1fr}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .3s ease both;cursor:default}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-4px)}
.card.owned{outline:2px solid var(--sky);outline-offset:-1px;background:var(--surface2)}
.card.owned .card-img{background:#0a1220}

.card-img{height:170px;background:#08091a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:contain;padding:8px;transition:transform .35s}
.card:hover .card-img img{transform:scale(1.08)}
.placeholder{width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;display:none}
.ph-name{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;opacity:.4;line-height:1.3;font-family:'Exo 2',sans-serif}

.game-badge{position:absolute;top:8px;left:8px;font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#000;z-index:2;white-space:nowrap}
.owned-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:rgba(255,255,255,.25);transition:all .15s;user-select:none;z-index:2;backdrop-filter:blur(4px)}
.owned-btn:hover{border-color:var(--sky);color:var(--sky)}
.owned-btn.owned{background:var(--sky);border-color:var(--sky);color:#000}

.card-body{padding:10px 12px 13px}
.card-type{font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--muted);margin-bottom:3px;text-transform:uppercase}
.card-name{font-family:'Exo 2',sans-serif;font-size:15px;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:7px;letter-spacing:.2px}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.elem-tag{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap;color:#000}
.variant-tag{font-size:10px;color:var(--muted2);font-weight:600}
.variant-tag::before{content:'✦ ';color:var(--gold);font-size:9px}

/* list view */
.grid.list-view .card{display:flex;flex-direction:row;align-items:center}
.grid.list-view .card-img{width:80px;height:80px;flex-shrink:0;border-radius:0}
.grid.list-view .card-img img{padding:4px}
.grid.list-view .card-body{flex:1;padding:10px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.grid.list-view .card-name{margin-bottom:0;font-size:14px}
.grid.list-view .game-badge{top:5px;left:5px;font-size:8px;padding:2px 7px}
.grid.list-view .owned-btn{top:5px;right:5px}

.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:14px;opacity:.3}
.empty p{font-family:'Exo 2',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
@media(max-width:480px){:root{--card-w:140px}h1{font-size:3rem}}
</style>
</head>

<header>

  <h1>SKYLANDERS</h1>
  <p class="subtitle">Every figure ever placed on the Portal — <strong id="totalCount">…</strong> items across 6 games</p>
  <div class="stats">
    <div class="stat"><div class="stat-val sky" id="statOwned">0</div><div class="stat-lbl">Owned</div></div>
    <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val gold" id="statPct">0%</div><div class="stat-lbl">Complete</div></div>
    <div class="stat"><div class="stat-val">6</div><div class="stat-lbl">Games</div></div>
  </div>
</header>

<div class="controls">

  </div>
  <div class="filter-group">
    <div class="filter-label">Game</div>
    <div class="filter-row" id="gameFilters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-label">Type</div>
    <div class="filter-row" id="typeFilters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-label">Element</div>
    <div class="filter-row" id="elemFilters"></div>
  </div>
  <div class="toolbar">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="owned-pill" id="ownedCount">✓ 0 owned</div>
      <div class="count-pill" id="countPill">Showing 0 items</div>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="gridViewBtn" title="Grid" onclick="setView('grid')">⊞</button>
      <button class="view-btn" id="listViewBtn" title="List" onclick="setView('list')">☰</button>
    </div>
  </div>
</div>
<div id="output"></div>

// build filter buttons
function makeFilterGroup(containerId, filters, colorFn, labelFn){
  const el=document.getElementById(containerId);
  filters.forEach(f=>{
    const btn=document.createElement("button");
    btn.className="filter-btn"+(f==="All"?" active":"");
    btn.textContent=labelFn?labelFn(f):f;
    btn.dataset.val=f;
    const col=colorFn(f);
    if(f==="All"||col){
      if(f==="All"){btn.style.cssText=`background:#00c8ff;color:#000;border-color:#00c8ff`;}
    }
    btn.addEventListener("click",()=>{
      el.querySelectorAll(".filter-btn").forEach(b=>{b.classList.remove("active");b.style.cssText=""});
      btn.classList.add("active");
      const c=colorFn(f);
      if(c)btn.style.cssText=`background:${c};color:${f==="All"?"#000":(["Air","Life","Tech","Light"].includes(f)?"#000":"#fff")};border-color:${c}`;
      else if(f==="All")btn.style.cssText=`background:#00c8ff;color:#000;border-color:#00c8ff`;
      return c;
    });
    el.appendChild(btn);
  });
}

      el.querySelectorAll(".filter-btn").forEach(b=>{b.classList.remove("active");b.style.cssText=""});
      btn.classList.add("active");
      btn.style.cssText=`background:${col};color:${fg};border-color:${col}`;
      activeElem=e;render();
    });
    el.appendChild(btn);
  });
})();

function makeCard(data,delay){
  const gc=gameColors[data.game]||"#00c8ff";
  const ec=elemColors[data.elem]?elemColors[data.elem][0]:"#888";
  const ecfg=elemColors[data.elem]?elemColors[data.elem][1]:"#fff";
  const key=itemKey(data), isOwned=owned.has(key);
  const card=document.createElement("div");
  card.className="card"+(isOwned?" owned":"");
  card.style.animationDelay=delay+"s";

  const imgArea=document.createElement("div");
  imgArea.className="card-img";

  const img=document.createElement("img");
  img.alt=data.name+(data.variant?" — "+data.variant:"");
  img.loading="lazy";
  img.src=data.img;

  const ph=document.createElement("div");
  ph.className="placeholder";
  ph.style.cssText=`display:none;background:${ec}10`;
  ph.innerHTML=`<div class="ph-name" style="color:${ec}">${(data.name).toUpperCase()}</div>`;
  img.onerror=()=>{img.style.display="none";ph.style.display="flex"};
  imgArea.appendChild(ph);
  imgArea.appendChild(img);

  const badge=document.createElement("div");
  badge.className="game-badge";
  badge.style.background=gc;
  badge.textContent=gameLabels[data.game]||data.game;
  imgArea.appendChild(badge);

  const ownBtn=document.createElement("div");
  ownBtn.className="owned-btn"+(isOwned?" owned":"");
  ownBtn.textContent="✓";
  ownBtn.addEventListener("click",e=>{
    e.stopPropagation();
    if(owned.has(key)){owned.delete(key);ownBtn.classList.remove("owned");card.classList.remove("owned");}
    else{owned.add(key);ownBtn.classList.add("owned");card.classList.add("owned");}
    localStorage.setItem("sky_owned",JSON.stringify([...owned]));
    updateStats();
  });
  imgArea.appendChild(ownBtn);
  card.appendChild(imgArea);

  const body=document.createElement("div");
  body.className="card-body";
  body.innerHTML=`
    <div class="card-type">${typeLabels[data.type]||data.type}</div>
    <div class="card-name">${data.name}</div>
    <div class="card-tags">
      <span class="elem-tag" style="background:${ec};color:${ecfg}">${data.elem}</span>
      ${data.variant?`<span class="variant-tag">${data.variant}</span>`:""}
    </div>`;
  card.appendChild(body);

  card.addEventListener("mouseenter",()=>{
    card.style.borderColor=ec+"60";
    card.style.boxShadow=`0 14px 36px ${ec}22`;
  });
  card.addEventListener("mouseleave",()=>{
    card.style.borderColor="";
    card.style.boxShadow="";
  });
  return card;
}

function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const out=document.getElementById("output"); out.innerHTML="";

  const filtered=figures.filter(f=>{
    if(activeGame!=="All"&&f.game!==activeGame) return false;
    if(activeType!=="All"&&f.type!==activeType) return false;
    if(activeElem!=="All"&&f.elem!==activeElem) return false;
    if(q&&!(
      f.name.toLowerCase().includes(q)||
      (f.variant||"").toLowerCase().includes(q)||
      f.elem.toLowerCase().includes(q)||
      (gameLabels[f.game]||"").toLowerCase().includes(q)||
      (typeLabels[f.type]||"").toLowerCase().includes(q)
    )) return false;
    return true;
  });

  if(!filtered.length){
    const g=document.createElement("div");g.className="grid";
    g.innerHTML=`<div class="empty"><div class="empty-icon">⊘</div><p>No figures match "${q||"current filters"}"</p></div>`;
    out.appendChild(g);
  } else {
    // group by game for section labels
    const byGame={};
    filtered.forEach(f=>{(byGame[f.game]=byGame[f.game]||[]).push(f)});
    const gameOrder=["SSA","SG","SSF","TT","SC","IM"];
    let idx=0;
    gameOrder.forEach(g=>{
      if(!byGame[g]) return;
      const lbl=document.createElement("div");
      lbl.className="section-label";
      lbl.innerHTML=`<span>${gameLabels[g]||g} · ${byGame[g].length} items</span>`;
      out.appendChild(lbl);
      const grid=document.createElement("div");
      grid.className="grid"+(viewMode==="list"?" list-view":"");
      byGame[g].forEach((f,i)=>grid.appendChild(makeCard(f,Math.min((idx++)*0.008,0.3))));
      out.appendChild(grid);
    });
  }

  document.getElementById("countPill").textContent=`Showing ${filtered.length} item${filtered.length!==1?"s":""}`;
  updateStats();
}

function updateStats(){
  const t=figures.length, n=owned.size, pct=t>0?Math.round(n/t*100):0;
  document.getElementById("statOwned").textContent=n;
  document.getElementById("statTotal").textContent=t;
  document.getElementById("statPct").textContent=pct+"%";
  document.getElementById("totalCount").textContent=t;
  document.getElementById("ownedCount").textContent=`✓ ${n} owned`;
}

function setView(mode){
  viewMode=mode;
  document.getElementById("gridViewBtn").classList.toggle("active",mode==="grid");
  document.getElementById("listViewBtn").classList.toggle("active",mode==="list");
  render();
}

updateStats();render();
document.getElementById("search").addEventListener("input",render);
</script>
</body>
</html>
